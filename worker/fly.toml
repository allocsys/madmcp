app = "repo-map-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# secrets (set via `fly secrets set`, not committed):
#   DATABASE_URL          - Neon Postgres connection string (pgvector enabled)
#   OPENAI_API_KEY         - for embeddings
#   REPO_MAP_SHARED_SECRET - shared-secret header value madmcp must send
#   GITHUB_APP_*           - if clone tokens are minted worker-side instead of passed in
