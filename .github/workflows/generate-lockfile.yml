name: Generate lockfile

# Manual maintenance workflow: this session's sandbox has no network access,
# so it can't run `npm install` to produce a real package-lock.json. GitHub
# Actions does have network access, so run this once (and again any time
# dependencies change) to generate and commit one -- then switch ci.yml over
# to setup-node's built-in `cache: npm` (keyed on the lockfile) + `npm ci`.
on:
  workflow_dispatch: {}

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (generates package-lock.json)
        run: npm install

      - name: Commit lockfile if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          # Use `git diff --cached` (staged), not plain `git diff` -- the
          # latter only detects changes to already-tracked files and misses
          # a brand-new, never-before-committed lockfile entirely.
          if git diff --cached --quiet; then
            echo "package-lock.json unchanged, nothing to commit"
          else
            git commit -m "chore: regenerate package-lock.json"
            git push
          fi
