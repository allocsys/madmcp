name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel a superseded run when new commits land on the same branch/PR, so
# force-pushes and rapid follow-up commits don't pile up redundant in-flight
# runs competing for runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: this workflow only reads the repo and runs tests,
# it never needs to write anything (unlike generate-lockfile.yml).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # package-lock.json now exists (generate-lockfile.yml, 2026-07-25),
          # so use setup-node's built-in cache keyed on it, and npm ci for a
          # reproducible install, instead of the old package.json-keyed
          # manual actions/cache + npm install workaround.
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check all source files
        run: |
          set -e
          find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

      - name: Run unit tests
        run: npm test

      - name: Smoke test -- server boots and GET /health responds
        run: |
          set -e
          node server.js > server.log 2>&1 &
          SERVER_PID=$!
          ok=""
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          kill "$SERVER_PID" || true
          if [ -z "$ok" ]; then
            echo "Server did not become healthy in time. Server log:"
            cat server.log
            exit 1
          fi
          echo "Health check passed"
